<svg viewBox="0 0 500 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bts-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.7" />
    </filter>
    <linearGradient id="red-gradient" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stopColor="#ff4040" />
      <stop offset="100%" stopColor="#d11a1a" />
    </linearGradient>
    <linearGradient id="blue-gradient" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stopColor="#2575fc" />
      <stop offset="100%" stopColor="#104fb5" />
    </linearGradient>
  </defs>

  <ellipse cx="250" cy="125" rx="220" ry="110" fill="white" opacity="0.96" />

  <g filter="url(#bts-glow)">
    <text
      x="250"
      y="95"
      textAnchor="middle"
      font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive, sans-serif"
      font-size="98"
      font-weight="900"
      font-style="italic"
      fill="url(#red-gradient)"
      stroke="#b31212"
      stroke-width="2.5"
      letter-spacing="-1px"
    >
      Battle
    </text>
  </g>

  <text
    x="250"
    y="132"
    textAnchor="middle"
    font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif"
    font-size="36"
    font-weight="900"
    font-style="italic"
    fill="#1c1917"
    letter-spacing="1px"
  >
    to
  </text>

  <g filter="url(#bts-glow)">
    <text
      x="250"
      y="215"
      textAnchor="middle"
      font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive, sans-serif"
      font-size="106"
      font-weight="900"
      font-style="italic"
      fill="url(#blue-gradient)"
      stroke="#0d3e8a"
      stroke-width="2.5"
      letter-spacing="-1px"
    >
      Survive
    </text>
  </g>
</svg>
